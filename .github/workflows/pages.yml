# Deploys the interactive POPS-BO demo (examples/pops_bo_web) to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "examples/pops_bo_web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the demo script parses
        run: node --check examples/pops_bo_web/pops_bo.js

      - name: Assemble site
        run: |
          mkdir -p _site/docs
          cp examples/pops_bo_web/index.html examples/pops_bo_web/pops_bo.js examples/pops_bo_web/results.js _site/
          cp examples/pops_bo_web/docs/*.pdf _site/docs/ 2>/dev/null || true
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
